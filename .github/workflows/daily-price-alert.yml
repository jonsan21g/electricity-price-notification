name: Daily Electricity Price Alert

on:
  schedule:
    # 13:30 CET (Winter is UTC+1 -> 12:30 UTC, Summer is UTC+2 -> 11:30 UTC)
    # Day-ahead spot prices are released daily by ~13:00 CET.
    # Running at 12:30 UTC guarantees data availability year-round (13:30 CET / 14:30 CEST).
    - cron: '30 12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab for easy testing

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Electricity Price Notifier
        env:
          PRICE_AREA: "DK2"
          CHEAP_THRESHOLD_DKK: "1.0"
          TOP_CHEAPEST_COUNT: "3"
          INCLUDE_TARIFFS: "true"
          GRID_OPERATOR: "Radius"
          NOTIFIERS_ENABLED: "whatsapp"
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        run: |
          python -m src.main
