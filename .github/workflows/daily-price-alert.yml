name: Daily Electricity Price Alert

on:
  schedule:
    # 13:21 Danish Local Time:
    # Summer (CEST, UTC+2) April to October: 11:21 UTC -> 13:21 CEST
    - cron: '21 11 * 4-10 *'
    # Winter (CET, UTC+1) November to March: 12:21 UTC -> 13:21 CET
    - cron: '21 12 * 1-3,11-12 *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab for easy testing

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Electricity Price Notifier
        env:
          PRICE_AREA: "DK2"
          CHEAP_THRESHOLD_DKK: "1.0"
          TOP_CHEAPEST_COUNT: "3"
          INCLUDE_TARIFFS: "true"
          GRID_OPERATOR: "Radius"
          NOTIFIERS_ENABLED: "whatsapp"
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        run: |
          python -m src.main
