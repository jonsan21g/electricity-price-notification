name: Daily Electricity Price Alert

on:
  # Triggered daily at 13:21 CET/CEST with zero delay via cron-job.org (Job ID: 8818640)
  # Native GitHub schedule disabled to prevent late duplicate alerts
  workflow_dispatch: # Allows trigger via GitHub REST API and manual UI runs

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Electricity Price Notifier
        env:
          PRICE_AREA: "DK2"
          CHEAP_THRESHOLD_DKK: "1.0"
          TOP_CHEAPEST_COUNT: "3"
          INCLUDE_TARIFFS: "true"
          GRID_OPERATOR: "Radius"
          NOTIFIERS_ENABLED: "whatsapp"
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        run: |
          python -m src.main
